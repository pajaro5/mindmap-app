<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis Mapas Mentales</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/vendor/simple-mind-map.umd.min.js"></script>
</head>
<body x-data="mindMapApp()" x-init="init()" :class="{ 'painter-active': painterActive }">

  <div class="app-shell">
    <!-- Barra de título: logo, barra de acceso rápido y nombre del mapa -->
    <header class="titlebar">
      <div class="app-logo" x-html="logo" title="Mapas Mentales"></div>
      <div class="qat">
        <template x-for="id in ribbon.quickAccess" :key="id">
          <button class="qat-btn" @mousedown.prevent :data-cmd="id" :title="tooltipOf(id)" :aria-label="labelOf(id)"
                  :disabled="!isEnabled(id)" @click="runCommand(id)" x-html="iconOf(id)"></button>
        </template>
      </div>
      <div class="window-title">
        <template x-if="currentId">
          <input class="title-input" type="text" x-model="currentTitle" @change="renameMap()" title="Renombrar mapa" />
        </template>
        <span class="app-name">Mapas Mentales</span>
      </div>
    </header>

    <!-- Cinta de opciones (generada a partir de ribbon.js).
         Los botones llevan @mousedown.prevent: al hacer clic no se llevan el foco, así los
         atajos del mapa (Ctrl+B, Tab, Enter…) siguen funcionando, como en Office. Con el
         teclado (Tab) se pueden enfocar igualmente. -->

    <nav class="ribbon-tabs" role="tablist">
      <template x-for="tab in ribbon.tabs" :key="tab.id">
        <button class="ribbon-tab" role="tab" :data-tab="tab.id" :class="{ active: ribbonTab === tab.id }"
                :aria-selected="ribbonTab === tab.id" @click="ribbonTab = tab.id" x-text="tab.label"></button>
      </template>
    </nav>

    <div class="ribbon">
      <template x-for="tab in ribbon.tabs" :key="tab.id">
        <div class="ribbon-panel" role="tabpanel" :data-tab-panel="tab.id" x-show="ribbonTab === tab.id">
          <template x-for="group in tab.groups" :key="group.label">
            <div class="ribbon-group" :data-group="group.label">
              <div class="ribbon-group-body">
                <!-- Grupo en filas de controles compactos (Formato) -->
                <template x-if="group.rows">
                  <div class="rb-rows">
                    <template x-for="(row, r) in group.rows" :key="r">
                      <div class="rb-row">
                        <template x-for="item in row" :key="item.key">
                          <div class="rb-row-item">
                            <template x-if="item.separator"><span class="rb-sep" aria-hidden="true"></span></template>

                            <template x-if="!item.separator && controlOf(item.cmd) === 'select'">
                              <select class="rb-select" :data-cmd="item.cmd" :title="tooltipOf(item.cmd)" :aria-label="labelOf(item.cmd)"
                                      :style="item.width ? `width:${item.width}px` : ''" :disabled="!isEnabled(item.cmd)"
                                      @change="runCommand(item.cmd, $event.target.value); $event.target.blur()"
                                      x-html="selectOptionsHtml(item.cmd)">
                              </select>
                            </template>

                            <template x-if="!item.separator && controlOf(item.cmd) === 'color'">
                              <div class="rb-color" :class="{ 'menu-open': menu && menu.owner === item.cmd }">
                                <button class="rb-icon-btn" @mousedown.prevent :data-cmd="item.cmd" :title="tooltipOf(item.cmd)" :aria-label="labelOf(item.cmd)"
                                        :disabled="!isEnabled(item.cmd)" @click="applyLastColor(item.cmd)">
                                  <span class="rb-icon" x-html="iconOf(item.cmd)"></span>
                                  <span class="rb-color-bar" :style="`background:${lastColors[item.cmd]}`"></span>
                                </button>
                                <button class="rb-color-arrow" @mousedown.prevent :data-menu-for="item.cmd" aria-haspopup="menu"
                                        :aria-expanded="!!(menu && menu.owner === item.cmd)" :disabled="!isEnabled(item.cmd)"
                                        :title="'Elegir ' + labelOf(item.cmd).toLowerCase()"
                                        @click.stop="toggleMenu(item.cmd, null, $event, 'palette')">▾</button>
                              </div>
                            </template>

                            <template x-if="!item.separator && !controlOf(item.cmd)">
                              <button class="rb-icon-btn" @mousedown.prevent :class="{ pressed: isPressed(item.cmd) }" :data-cmd="item.cmd"
                                      :title="tooltipOf(item.cmd)" :aria-label="labelOf(item.cmd)" :aria-pressed="isPressed(item.cmd)"
                                      :disabled="!isEnabled(item.cmd)" @click="runCommand(item.cmd)">
                                <span class="rb-icon" x-html="iconOf(item.cmd)"></span>
                              </button>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-for="col in group.columns" :key="col.key">
                  <div :class="col.type === 'large' ? 'rb-col-large' : 'rb-col-stack'">
                    <template x-for="item in col.items" :key="item.cmd">
                      <div class="rb-item" :class="{ 'rb-split': item.menu, 'menu-open': menu && menu.owner === item.cmd }">
                        <!-- Galería: el botón abre la lista de opciones (p. ej. formas) -->
                        <template x-if="controlOf(item.cmd) === 'gallery'">
                          <button :class="[col.type === 'large' ? 'rb-large' : 'rb-small', 'rb-gallery']"
                                  :data-cmd="item.cmd" :data-menu-for="item.cmd" :title="tooltipOf(item.cmd)" aria-haspopup="menu"
                                  :aria-expanded="!!(menu && menu.owner === item.cmd)" :disabled="!isEnabled(item.cmd)"
                                  @click.stop="toggleMenu(item.cmd, optionsOf(item.cmd), $event, 'options')">
                            <span class="rb-icon" x-html="iconOf(item.cmd)"></span>
                            <span class="rb-label"><span x-text="labelOf(item.cmd)"></span> ▾</span>
                          </button>
                        </template>
                        <template x-if="controlOf(item.cmd) !== 'gallery'">
                          <button @mousedown.prevent :class="[col.type === 'large' ? 'rb-large' : 'rb-small', isPressed(item.cmd) ? 'pressed' : '']"
                                  :data-cmd="item.cmd" :title="tooltipOf(item.cmd)" :aria-pressed="isPressed(item.cmd)"
                                  :disabled="!isEnabled(item.cmd)" @click="runCommand(item.cmd)">
                            <span class="rb-icon" x-html="iconOf(item.cmd)"></span>
                            <span class="rb-label" x-text="labelOf(item.cmd)"></span>
                          </button>
                        </template>
                        <template x-if="item.menu">
                          <button class="rb-menu-arrow" @mousedown.prevent :data-menu-for="item.cmd" aria-haspopup="menu"
                                  :aria-expanded="!!(menu && menu.owner === item.cmd)"
                                  :title="'Más opciones de ' + labelOf(item.cmd)"
                                  @click.stop="toggleMenu(item.cmd, item.menu, $event)">▾</button>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
              <div class="ribbon-group-label" x-text="group.label"></div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Desplegable de los botones divididos (fuera de la cinta para que no se recorte) -->
    <div class="ribbon-menu" role="menu" x-show="menu" x-cloak
         :style="menu ? `left:${menu.x}px;top:${menu.y}px` : ''"
         @click.outside="closeMenu()" @keydown.escape.stop="closeMenu()">
      <!-- Lista de comandos (botones divididos) -->
      <template x-if="menu && menu.kind === 'commands'">
        <div>
          <template x-for="id in menu.items" :key="id">
            <button class="ribbon-menu-item" role="menuitem" :data-cmd="id" :disabled="!isEnabled(id)" @click="runCommand(id)">
              <span class="rb-icon" x-html="iconOf(id)"></span>
              <span class="ribbon-menu-label" x-text="menuLabelOf(id)"></span>
              <span class="ribbon-menu-shortcut" x-text="shortcutOf(id)"></span>
            </button>
          </template>
        </div>
      </template>

      <!-- Paleta de colores -->
      <template x-if="menu && menu.kind === 'palette'">
        <!-- Las expresiones comprueban `menu`: al elegir se cierra (menu = null) y Alpine
             reevalúa estos enlaces antes de retirar la plantilla -->
        <div class="color-palette" :data-palette-for="menu && menu.owner">
          <button class="ribbon-menu-item palette-auto" role="menuitem" data-color="auto" @click="chooseColor(menu.owner, null)">
            <span class="swatch swatch-auto"></span><span class="ribbon-menu-label">Automático</span>
          </button>
          <template x-for="group in colorPalette" :key="group.name">
            <div class="palette-group">
              <div class="palette-title" x-text="group.name"></div>
              <div class="palette-row">
                <template x-for="color in group.colors" :key="color">
                  <button class="swatch" role="menuitem" :data-color="color" :title="color" :aria-label="color"
                          :class="{ current: !!menu && String(currentValueOf(menu.owner)).toLowerCase() === color }"
                          :style="`background:${color}`" @click="chooseColor(menu.owner, color)"></button>
                </template>
              </div>
            </div>
          </template>
          <label class="ribbon-menu-item palette-more">
            <span class="ribbon-menu-label">Más colores…</span>
            <input type="color" data-color-custom :value="menu ? lastColors[menu.owner] : '#000000'"
                   @change="chooseColor(menu.owner, $event.target.value)" />
          </label>
        </div>
      </template>

      <!-- Galería de opciones (formas) -->
      <template x-if="menu && menu.kind === 'options'">
        <div class="options-gallery">
          <template x-for="opt in menu.items" :key="opt.value">
            <button class="ribbon-menu-item" role="menuitemradio" :data-option="opt.value"
                    :aria-checked="!!menu && String(currentValueOf(menu.owner)) === String(opt.value)"
                    :class="{ current: !!menu && String(currentValueOf(menu.owner)) === String(opt.value) }"
                    @click="runCommand(menu.owner, opt.value)">
              <span class="option-preview" x-html="shapeIcons[opt.value] || ''"></span>
              <span class="ribbon-menu-label" x-text="opt.label"></span>
            </button>
          </template>
        </div>
      </template>
    </div>

    <!-- Área de trabajo: lienzo + panel de tareas + tira vertical de pestañas -->
    <div class="workspace">
      <main class="canvas-wrap">
        <div id="mindMapContainer"></div>
        <div class="placeholder" x-show="!currentId">
          <p>Selecciona un mapa en <strong>Mis mapas</strong> o crea uno nuevo para empezar.</p>
        </div>
        <div class="error-banner" x-show="errorMsg" x-text="errorMsg"></div>
      </main>

      <aside class="task-pane" x-show="pane">
        <div class="task-pane-header">
          <span x-text="{ maps: 'Mis mapas', markers: 'Marcadores', notes: 'Notas' }[pane] || ''"></span>
          <button class="task-pane-close" title="Cerrar panel" @click="togglePane(pane)">✕</button>
        </div>

        <div class="task-pane-body" x-show="pane === 'maps'">
          <button class="btn btn-primary btn-block" @click="runCommand('map.new')">+ Nuevo mapa</button>
          <ul class="map-list">
            <template x-for="m in maps" :key="m.id">
              <li :class="{ active: m.id === currentId }" @click="openMap(m.id)">
                <span class="map-doc-icon" aria-hidden="true"></span>
                <span class="map-title" x-text="m.title"></span>
                <button class="btn-icon" title="Eliminar" @click.stop="deleteMap(m.id)">✕</button>
              </li>
            </template>
            <li x-show="maps.length === 0" class="empty-hint">Aún no tienes mapas. Crea uno.</li>
          </ul>
        </div>

        <div class="task-pane-body markers" x-show="pane === 'markers'">
          <div class="icon-sidebar-hint" x-show="!hasActiveNode">
            Selecciona un tema del mapa para asignarle un marcador.
          </div>
          <template x-for="cat in iconCategories" :key="cat.type">
            <div class="icon-category">
              <div class="icon-category-title" x-text="cat.label"></div>
              <div class="icon-grid">
                <template x-for="item in cat.items" :key="item.id">
                  <button
                    class="icon-btn"
                    :class="{ active: isIconActive(item.id) }"
                    :disabled="!hasActiveNode"
                    :title="item.id"
                    @click="toggleIcon(item.id)"
                    x-html="item.svg"
                  ></button>
                </template>
              </div>
            </div>
          </template>
        </div>

        <!-- Notas del tema seleccionado (texto plano; se guarda al pausar la escritura) -->
        <div class="task-pane-body notes-pane" x-show="pane === 'notes'">
          <template x-if="activeNodeList.length === 1">
            <div class="notes-wrap">
              <div class="notes-topic" x-text="activeNodeList[0] ? activeNodeList[0].getData('text').replace(/<[^>]+>/g, '') : ''"></div>
              <textarea class="notes-editor" x-model="noteDraft" @input="onNoteInput()" @blur="flushNote()"
                        placeholder="Escribe aquí las notas de este tema…" aria-label="Notas del tema"></textarea>
            </div>
          </template>
          <div class="icon-sidebar-hint" x-show="activeNodeList.length !== 1"
               x-text="activeNodeList.length > 1 ? 'Selecciona un solo tema para ver o editar sus notas.' : 'Selecciona un tema para ver o editar sus notas.'"></div>
        </div>
      </aside>

      <nav class="task-strip" aria-label="Paneles">
        <template x-for="id in ['pane.maps', 'pane.markers', 'pane.notes']" :key="id">
          <button class="task-strip-tab" :data-cmd="id" :class="{ active: isPressed(id) }"
                  :title="tooltipOf(id)" @click="runCommand(id)">
            <span class="strip-icon" x-html="iconOf(id)"></span>
            <span x-text="labelOf(id)"></span>
          </button>
        </template>
      </nav>
    </div>

    <!-- Diálogo modal (nativo: atrapa el foco y se cierra con Esc) -->
    <dialog id="appDialog" class="app-dialog" @close="dialog = null" aria-labelledby="appDialogTitle">
      <template x-if="dialog && dialog.kind === 'hyperlink'">
        <form class="dialog-form" @submit.prevent="saveHyperlink()" novalidate>
          <h2 id="appDialogTitle" class="dialog-title">Hipervínculo</h2>
          <label class="dialog-field">
            <span>Dirección</span>
            <input name="url" type="text" x-model="dialog.url" placeholder="https://ejemplo.com" autocomplete="off"
                   :aria-invalid="!!dialog.error" @input="dialog.error = ''" />
          </label>
          <label class="dialog-field">
            <span>Texto que se muestra al pasar el ratón <em>(opcional)</em></span>
            <input name="title" type="text" x-model="dialog.title" maxlength="200" autocomplete="off" />
          </label>
          <p class="dialog-error" role="alert" x-show="dialog.error" x-text="dialog.error"></p>
          <div class="dialog-actions">
            <button type="button" class="btn dialog-remove" x-show="dialog.canRemove" @click="removeHyperlink()">Quitar vínculo</button>
            <span class="dialog-spacer"></span>
            <button type="submit" class="btn btn-primary">Aceptar</button>
            <button type="button" class="btn" @click="closeDialog()">Cancelar</button>
          </div>
        </form>
      </template>
    </dialog>

    <!-- Barra de estado -->
    <footer class="statusbar">
      <span class="status-item" x-text="maps.length + (maps.length === 1 ? ' mapa' : ' mapas')"></span>
      <span class="status-item save-status" x-text="saveStatus"></span>
      <div class="zoom-control" x-show="currentId">
        <button class="zoom-btn" @mousedown.prevent data-cmd="view.zoomOut" :title="tooltipOf('view.zoomOut')" @click="runCommand('view.zoomOut')">−</button>
        <input class="zoom-slider" type="range" min="20" max="400" step="5"
               :value="zoomPercent" @input="setZoomPercent($event.target.value)" title="Zoom" />
        <button class="zoom-btn" @mousedown.prevent data-cmd="view.zoomIn" :title="tooltipOf('view.zoomIn')" @click="runCommand('view.zoomIn')">+</button>
        <button class="zoom-value" @mousedown.prevent data-cmd="view.actualSize" :title="tooltipOf('view.actualSize')" @click="runCommand('view.actualSize')" x-text="zoomPercent + '%'"></button>
        <button class="zoom-btn" @mousedown.prevent data-cmd="view.fit" :title="tooltipOf('view.fit')" @click="runCommand('view.fit')">⤢</button>
      </div>
    </footer>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/elements.js"></script>
  <script src="/js/mindmap-extensions.js"></script>
  <script src="/js/commands.js"></script>
  <script src="/js/ribbon.js"></script>
  <script src="/js/app.js"></script>
  <!-- Alpine se sirve en local (no desde un CDN): la app funciona sin conexión y las pruebas
       no dependen de la red. Versión fijada: 3.14.3 -->
  <script src="/vendor/alpine-3.14.3.min.js" defer></script>
</body>
</html>
